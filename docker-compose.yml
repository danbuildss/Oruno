# Local Postgres for development and tests: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oruno
      POSTGRES_PASSWORD: oruno
      POSTGRES_DB: oruno_dev
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
